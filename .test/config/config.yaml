sample_sheet: "config/samples.tsv"

fastp:
  threads: 2

ref:
  mode: "local"
  hisat2_index_url: "https://genome-idx.s3.amazonaws.com/hisat/grch38_genome.tar.gz"
  hisat2_index_prefix: "local/genome"
  gtf_url: "https://ftp.ensembl.org/pub/release-116/gtf/homo_sapiens/Homo_sapiens.GRCh38.116.gtf.gz"
  ensembl_release: 116
  fasta: "data/test_reference.fa"
  gtf: "data/test_annotation.gtf"

featurecounts:
  strandedness: 0 # test only

de:
  counts: "data/sim_counts_matrix.tsv"
  samples: "data/sim_samples.tsv"
  gene_annotation: "data/sim_gene_annotation.tsv"
  patient_column: "patient"
  condition_column: "condition"
  reference: "normal"
  min_count: 10
  min_samples: 3
  padj: 0.05
  lfc: 1
  sensitivity_exclude_patients: []

enrichment:
  padj: 0.05
  min_size: 1
  max_size: 500

# Tiny local fixtures for the preprint reproduction branch.
preprint:
  fpkm: "data/preprint_fpkm.tsv" # Synthetic tab-separated expression matrix.
  series_matrix: "data/preprint_series_matrix.txt.gz" # Synthetic GSM metadata fixture.
  original_degs: "data/preprint_original_degs.csv" # Synthetic original DEG comparison table.
  original_kegg: "data/preprint_original_kegg.csv" # Synthetic original KEGG comparison table.
  kegg_aliases:
    "cell adhesion molecules": "KEGG_CELL_ADHESION_MOLECULES_CAMS" # Exercise the known KEGG pathway rename alias.
  samples: [RC1_N, RC1_T, RC2_N, RC2_T] # Explicit fixture sample columns; two other columns are excluded.
  min_mean_log2: 0 # Keep genes in this small fixture.
  padj: 0.05 # Fixture significance threshold.
  lfc: 0.1 # Fixture fold-change threshold.
  expected_genes: 4 # Expected retained fixture genes.
  expected_degs: 3 # Observed in the four-gene fixture.
  expected_up: 2 # Observed in the four-gene fixture.
  expected_down: 1 # Observed in the four-gene fixture.
