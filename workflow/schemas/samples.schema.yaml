$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
properties:
  sample:
    type: string
    minLength: 1
  patient:
    type: string
    minLength: 1
  condition:
    type: string
    enum: [tumor, normal]
  run:
    type: string
    minLength: 1
  fq1:
    type: string
    minLength: 1
  fq2:
    type: string
    minLength: 1
required: [sample, patient, condition, run, fq1, fq2]
additionalProperties: false
