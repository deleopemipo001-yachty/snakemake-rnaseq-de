$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
properties:
  sample_sheet:
    type: string
    minLength: 1
  fastp:
    type: object
    properties:
      threads:
        type: integer
        minimum: 1
        maximum: 4
    required: [threads]
    additionalProperties: false
  ref:
    type: object
    properties:
      mode:
        type: string
        enum: [download, local]
      hisat2_index_url:
        type: string
        format: uri
      hisat2_index_prefix:
        type: string
        minLength: 1
      gtf_url:
        type: string
        format: uri
      ensembl_release:
        type: integer
        minimum: 1
      fasta:
        type: string
        minLength: 1
      gtf:
        type: string
        minLength: 1
    required:
      - mode
      - hisat2_index_url
      - hisat2_index_prefix
      - gtf_url
      - ensembl_release
    additionalProperties: false
    allOf:
      - if:
          properties:
            mode:
              const: local
        then:
          required: [fasta, gtf]
      - if:
          properties:
            mode:
              const: download
        then:
          not:
            anyOf:
              - required: [fasta]
              - required: [gtf]
  featurecounts:
    type: object
    properties:
      strandedness:
        type: [integer, "null"]
        enum: [0, 1, 2, null]
    required: [strandedness]
    additionalProperties: false
  de:
    type: object
    properties:
      counts:
        type: string
        minLength: 1
      samples:
        type: string
        minLength: 1
      gene_annotation:
        type: string
        minLength: 1
      patient_column:
        type: string
        minLength: 1
      condition_column:
        type: string
        minLength: 1
      reference:
        type: string
        enum: [normal]
      min_count:
        type: integer
        minimum: 0
      min_samples:
        type: integer
        minimum: 1
      padj:
        type: number
        exclusiveMinimum: 0
        maximum: 1
      lfc:
        type: number
        minimum: 0
      sensitivity_exclude_patients:
        type: array
        items:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9_.-]+$"
        uniqueItems: true
    required:
      - counts
      - samples
      - gene_annotation
      - patient_column
      - condition_column
      - reference
      - min_count
      - min_samples
      - padj
      - lfc
      - sensitivity_exclude_patients
    additionalProperties: false
  enrichment:
    type: object
    properties:
      padj:
        type: number
        exclusiveMinimum: 0
        maximum: 1
      min_size:
        type: integer
        minimum: 1
      max_size:
        type: integer
        minimum: 1
    required: [padj, min_size, max_size]
    additionalProperties: false
  preprint:
    type: object
    properties:
      fpkm: {type: string, minLength: 1}
      series_matrix: {type: string, minLength: 1}
      original_degs: {type: string, minLength: 1}
      original_kegg: {type: string, minLength: 1}
      kegg_aliases:
        type: object
        propertyNames: {type: string}
        additionalProperties: {type: string, minLength: 1}
      samples:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      min_mean_log2: {type: number}
      padj: {type: number, exclusiveMinimum: 0, maximum: 1}
      lfc: {type: number, minimum: 0}
      expected_genes: {type: integer, minimum: 0}
      expected_degs: {type: integer, minimum: 0}
      expected_up: {type: integer, minimum: 0}
      expected_down: {type: integer, minimum: 0}
    required: [fpkm, series_matrix, original_degs, original_kegg, kegg_aliases, samples, min_mean_log2, padj, lfc, expected_genes, expected_degs, expected_up, expected_down]
    additionalProperties: false
required: [sample_sheet, fastp, ref, featurecounts, de, enrichment, preprint]
additionalProperties: false
