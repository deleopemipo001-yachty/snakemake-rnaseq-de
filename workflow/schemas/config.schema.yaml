$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
properties:
  sample_sheet:
    type: string
    minLength: 1
  fastp:
    type: object
    properties:
      threads:
        type: integer
        minimum: 1
        maximum: 4
    required: [threads]
    additionalProperties: false
required: [sample_sheet, fastp]
additionalProperties: false
