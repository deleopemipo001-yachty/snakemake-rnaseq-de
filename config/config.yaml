sample_sheet: "config/samples.tsv"

# These settings control compute use only; fastp uses its defaults otherwise.
fastp:
  threads: 2

ref:
  mode: "download"
  hisat2_index_url: "https://genome-idx.s3.amazonaws.com/hisat/grch38_genome.tar.gz"
  hisat2_index_prefix: "grch38/genome"
  gtf_url: "https://ftp.ensembl.org/pub/release-116/gtf/homo_sapiens/Homo_sapiens.GRCh38.116.gtf.gz"
  ensembl_release: 116

featurecounts:
  strandedness: 0 # Confirmed unstranded from RC1_T (SRR10733633): -s0 69.19%, -s1 43.70%, -s2 43.64%

de:
  counts: "results/counts/counts_matrix.tsv"
  samples: "config/samples.tsv"
  gene_annotation: "results/deseq2/gene_annotation.tsv"
  patient_column: "patient"
  condition_column: "condition"
  reference: "normal"
  min_count: 10
  min_samples: 6
  padj: 0.05
  lfc: 1
  sensitivity_exclude_patients: ["RC2"]

enrichment:
  padj: 0.05
  min_size: 10
  max_size: 500

# Reproduce and compare the GEO preprint analysis; input files are supplied locally.
preprint:
  fpkm: "resources/preprint/GSE142279/GSE142279_FPKM.xls" # Plain TSV expression matrix.
  series_matrix: "resources/preprint/GSE142279/GSE142279_series_matrix.txt.gz" # GEO metadata used to map GSM accessions.
  original_degs: "resources/preprint/DEGs_from_GEO_FPKM.csv" # Original DEG table for reproduction checks.
  original_kegg: "resources/preprint/KEGG_from_GEO_FPKM.csv" # Original KEGG table for descriptive comparison.
  kegg_aliases:
    "cell adhesion molecules": "KEGG_CELL_ADHESION_MOLECULES_CAMS" # KEGG renamed this pathway after the MSigDB legacy release.
  samples: [RC1_N, RC1_T, RC2_N, RC2_T, RC3_N, RC3_T, RC4_N, RC4_T, RC5_N, RC5_T, RC6_N, RC6_T] # Explicit FPKM columns to reproduce.
  min_mean_log2: 1 # Minimum mean log2(FPKM + 1) before duplicate IDs are collapsed.
  padj: 0.05 # Adjusted p-value threshold for reproduced DEGs.
  lfc: 1 # Absolute unshrunken log fold-change threshold for reproduced DEGs.
  expected_genes: 12407 # Expected number of genes after filtering.
  expected_degs: 927 # Expected total reproduced DEGs.
  expected_up: 440 # Expected up-regulated reproduced DEGs.
  expected_down: 487 # Expected down-regulated reproduced DEGs.
